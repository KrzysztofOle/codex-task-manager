[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-manager"
version = "0.1.0"
description = "Local read-only task queue for Codex CLI"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ctm = "ctm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
